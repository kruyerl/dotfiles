# Reload config with prefix + p
unbind r
bind p source-file ~/.tmux.conf \; display-message "Config reloaded!"

# Enable True Color
set -g default-terminal "tmux-256color"
set -as terminal-features ",*:RGB"

# Set escape-time
set-option -sg escape-time 10
set-option -g focus-events on

# Use system clipboard when supported by the terminal
set -g set-clipboard external

# Set prefix to Alt+d
set -g prefix M-d
bind M-d send-prefix

# Mouse & Keybindings
set -g mouse on
set -g status-keys vi
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel

# Prompt for window name
bind t command-prompt "rename-window '%%'"

# New windows and splits inherit the current pane's working directory
bind c new-window -c '#{pane_current_path}'
bind | split-window -h -c '#{pane_current_path}'
bind _ split-window -v -c '#{pane_current_path}'

# Pane navigation and resizing (Vi-like)
bind -r h select-pane -L
bind -r j select-pane -D
bind -r k select-pane -U
bind -r l select-pane -R
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Quick Window Selection
bind q select-window -t 1
bind w select-window -t 2
bind e select-window -t 3
bind r select-window -t 4

# Status Bar Configuration
set-option -g allow-rename off
set -g status on
set -g status-interval 5
set -g status-position top
set -g status-justify centre
set -g status-style "bg=default,fg=#abb2bf"
set -g extended-keys on
set -g message-style "bg=#3e4451,fg=#ffffff"
set -g mode-style "bg=#e5c07b,fg=#1e222a"
set -g pane-border-style "fg=#3e4451"
set -g pane-active-border-style "fg=#e5c07b"

# Left: Session Name
set -g status-left-length 30
set -g status-left " #[fg=#e5c07b,bold] #[fg=#abb2bf,bold]#S #[default]"

# Window List Styling
setw -g window-status-format " #[fg=#5c6370]#I:#W#{?window_flags,#{window_flags},} "
setw -g window-status-current-format " #[bg=#3e4451,fg=#e5c07b,bold]#I:#W#[default] "
setw -g window-status-style "bg=default,fg=#5c6370"
setw -g window-status-current-style "bg=#3e4451,fg=#e5c07b,bold"

# Right: System Info
set -g status-right-length 50
set -g status-right "#[fg=#e5c07b] #[fg=#abb2bf]%Y-%m-%d #[fg=#e5c07b] #[fg=#abb2bf]%H:%M "

# Sensible defaults
set -g history-limit 100000
set -g display-time 2000
set -g repeat-time 300

# Start window and pane indexing from 1
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# Plugin Management
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'tmux-plugins/tmux-resurrect'

# Automatically save and restore sessions
set -g @resurrect-save 'on'
set -g @resurrect-restore 'on'
set -g @resurrect-save-interval '10'

# Auto-install TPM if not present
if "test ! -d ~/.tmux/plugins/tpm" \
   "run 'git clone https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm && ~/.tmux/plugins/tpm/bin/install_plugins'"

# Initialize TPM (Keep at the bottom)
run '~/.tmux/plugins/tpm/tpm'
